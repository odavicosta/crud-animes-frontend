<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Clover Wiki - Grimório</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <img src="./assets/icon.jpg" alt="icon black clover" class="icone-bc">

        <div class="logo-container">
            <h1>CATÁLOGO <span>BLACK CLOVER</span></h1>
            <p>Registro Oficial dos Cavaleiros Mágicos</p>
        </div> 

        <button class="btnAdicionar" onclick="localStorage.removeItem('magoEditando'); window.location.href='cadastro.html'">Adicionar mago novo</button>
    </header>

    <div class="filtros">
        <input type="text" id="filtroNome" placeholder="Buscar mago...">
        
        <select id="filtroMagia">
            <option value="">Todas as magias</option>
            <option value="Anti-Magia">Anti-Magia</option>
            <option value="Vento">Vento</option>
            <option value="Fogo">Fogo</option>
            <option value="Água">Água</option>
            <option value="Trevas">Trevas</option>
            <option value="Luz">Luz</option>
            <option value="Relâmpago">Relâmpago</option>
        </select>
        
        <select id="filtroLocal">
            <option value="">Todos os locais</option>
            <option value="Reino de Clover">Reino de Clover</option>
            <option value="Reino Hearth">Reino Hearth</option>
            <option value="Reino Diamond">Reino Diamond</option>
            <option value="Reino Spade">Reino Spade</option>
            <option value="Floresta das Bruxas">Floresta das Bruxas</option>
            <option value="País do Sol">País do Sol</option>
        </select>
        
        <select id="filtroEsquadrao">
            <option value="">Todos os Esquadrões</option>
            <option value="Touros Negros">Touros Negros</option>
            <option value="Alvorecer Dourado">Alvorecer Dourado</option>
            <option value="Águias de Prata">Águias de Prata</option>
            <option value="Rosa Azul">Rosa Azul</option>
            <option value="Reis Leões Carmesins">Reis Leões Carmesins</option>
            <option value="Louva-a-Deus Verdes">Louva-a-Deus Verdes</option>
            <option value="Pavões Corais">Pavões Corais</option>
            <option value="Órcas Púrpuras">Órcas Púrpuras</option>
            <option value="Cervos Cianos">Cervos Cianos</option>
        </select>
        
        <button id="btnBuscar" class="btn-primario">Filtrar</button>
    </div>

    <main class="container">
        <section class="painel-lista">
            <div class="cabecalho-lista">
                <h2>Catálogo de Magos</h2>
                <span class="contador">0 Personagem</span>
            </div>
            
            <div class="grid-personagens" id="containerPersonagens"></div>
        </section>
    </main>

    <script src="./app.js"></script>
</body>
</html>
